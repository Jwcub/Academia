<h1>Ramschema</h1>

{{ points() }} HP

<table>
    <thead>
        <tr>
            <th>Kurskod</th>
            <th>Kursnamn</th>
            <th>Poäng</th>
            <th>Ämne</th>
            <th>Kursplan</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        @for (course of savedCourses(); track course.courseCode) {
        <tr>
        <td>{{ course.courseCode }}</td>
        <td>{{ course.courseName }}</td>
        <td>{{ course.points }}</td>
        <td>{{ course.subject }}</td>
        <td>{{ course.syllabus }}</td>
        <td><button (click)="deleteCourse(course)">radera kurs</button></td>
        </tr>
        } @empty {
        <td colspan="6">Du har inte lagt till några kurser</td>
        }
    </tbody>
</table>
