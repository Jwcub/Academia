<h1>Mitt ramschema</h1>

{{ points() }} HP av max 45 HP

<section class="program-courselist">
    @for (course of savedCourses(); track course.courseCode) {
        <article class="program-course">
            <div class="course-details">
                <div class="course-code">{{ course.courseCode }}</div>
                <div class="course-name"><h3>{{ course.courseName }}</h3></div>
                <div class="textbox">{{ course.subject }} </div>
                <div class="textbox">{{ course.points }} HP</div>
                <div class="textbox"><i class="material-icons syllabys-icon">menu_book</i><a href="{{ course.points }}">Kursplan</a></div>
            </div>
            <div class="delete-course">
                <button (click)="deleteCourse(course)" class="delete-btn" matIconButton aria-label="Radera kurs" matTooltip="Radera kurs från ramschema">
                    <mat-icon>close</mat-icon>
                </button>
            </div>
        </article>
    }
</section>
