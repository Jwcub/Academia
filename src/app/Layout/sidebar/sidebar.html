@if(savedCourses().length < 1) {

    <app-alternative-sidebar></app-alternative-sidebar>
    
} @else {
    <section class="saved-courses-list">
        <h2>Tillagda kurser</h2>
        <p>Sammanlagda högskolepoäng: <strong>{{ points() }} HP</strong></p>
        @for (course of savedCourses(); track course.courseCode) {
            <article class="saved-course">
                <h3>{{ course.courseCode }} </h3>
                <span style="font-weight: 500;">{{ course.courseName }}</span>
            </article>
        }
        <button routerLink="/program">Hantera kurser</button>
     </section>

}
