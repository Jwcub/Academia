<header>
  <div class="wrapper page-header">

    <div class="brand">
      <a href="/" class="logo-text">Academia</a>
    </div>

    <nav class="main-nav">
        <ul>
          <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Startsida</a></li>
          <li><a routerLink="courses" routerLinkActive="active">Kurser</a></li>
          <li><a routerLink="program" routerLinkActive="active">Mitt ramschema</a></li>
        </ul>
    </nav>

    <nav class="utility">
        <button class="tool-btn" mat-icon-button (click)="themeService.toggleTheme()">
        <mat-icon>{{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </nav>

  </div>
</header>
